# Weekly grouped dependency updates. Minor and patch bumps arrive as one PR
# per ecosystem and directory. Majors come as their own PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      docker-minor:
        update-types: [minor, patch]
    ignore:
      # Odd node majors (25, 27) never become LTS. The image follows the even major the CI matrix tests and
      # moves with the matrix by hand (2026-11-08). Drop only if Dependabot learns to skip odd majors on its own.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
