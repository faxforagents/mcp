name: publish

# Publishes to npm and lists the server in the MCP Registry when a GitHub Release is published.
# Provenance: livetennisapi-oss/livetennisapi-mcp/.github/workflows/publish.yml (2026-10-28), actions pinned by SHA.
#
# npm Trusted Publishing (OIDC): no NPM_TOKEN exists. Configured on npm at Package, Settings, Trusted
# Publisher: Owner faxforagents, Repo mcp, Workflow publish.yml, Environment npm. npm needs the package
# to exist before OIDC can be configured, so 0.1.0 is published once with a short-lived granular token
# that is revoked right after (PUBLISH.md of the org).
#
# The MCP Registry is authenticated with the same GitHub OIDC token (mcp-publisher login github-oidc).
# Ownership is proven by the mcpName field of the published package.json matching server.json's name.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/faxforagents-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Assert the tag matches package.json and server.json
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          SRV="$(node -p "require('./server.json').version")"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$SRV" ]; then
            echo "::error::release tag ($TAG) does not match package.json ($PKG) or server.json ($SRV)"
            exit 1
          fi
          echo "tag and versions agree: $PKG"

      # npm >= 11.5.1 is required for OIDC trusted publishing.
      - run: npm install -g npm@latest

      # Since 2026-11-09 this repository's OIDC tokens carry the immutable subject format
      # (repo:owner@id/name@id), which GitHub does not let a repository turn off and which the npm
      # registry does not match yet: the token exchange answers "package not found" and npm then
      # publishes unauthenticated, so the PUT fails with 404 (npm/cli issue 9969). Until npm accepts
      # that format the step publishes with the granular NPM_TOKEN secret (publish only, this package,
      # bypass 2FA, short expiry). Provenance still comes from the id-token permission. When the secret
      # is absent the step falls back to the OIDC exchange, so removing the secret restores trusted
      # publishing the day npm fixes it.
      - name: Publish to npm (skip if already published)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$(npm view faxforagents-mcp@$PKG version 2>/dev/null)" = "$PKG" ]; then
            echo "faxforagents-mcp@$PKG is already on npm, skipping"
          else
            npm publish --provenance --access public
          fi

      - name: Publish to the MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # The registry checks that npm already serves this version. Right after the npm step npm's read
          # path can lag by a minute or two (0.4.2 and 0.4.3 both failed once on 2026-11-09 with "version
          # was not found"), so try up to six times, a minute apart, before giving up.
          for attempt in 1 2 3 4 5 6; do
            if ./mcp-publisher publish; then exit 0; fi
            echo "registry publish attempt $attempt failed, waiting 60 s for npm to propagate"
            sleep 60
          done
          echo "::error::the MCP Registry refused the publish six times"
          exit 1
